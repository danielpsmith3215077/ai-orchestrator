<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      id="seo-crawler-policy"
      name="robots"
      content="index,follow"
    />
    <meta
      name="description"
      content="Meridian98 — B2B cloud consulting for SaaS and enterprise teams. Architecture, modernization, and platform delivery that holds up under real load."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Meridian98 — Enterprise cloud consulting for B2B teams</title>
    <script>
      (function () {
        var meta = document.getElementById("seo-crawler-policy");
        if (!meta) return;
        var hash = window.location.hash || "";
        if (hash.indexOf("#/dashboard") === 0) {
          meta.setAttribute("content", "noindex,nofollow");
        } else {
          meta.setAttribute("content", "index,follow");
        }
        window.addEventListener("hashchange", function () {
          var h = window.location.hash || "";
          meta.setAttribute(
            "content",
            h.indexOf("#/dashboard") === 0 ? "noindex,nofollow" : "index,follow"
          );
        });
      })();
    </script>
    <!-- {{ANALYTICS_SCRIPT}} -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
